<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agenda de Estudio</title>
  <meta name="description" content="Tus tareas de la universidad, ordenadas por fecha de entrega.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='5' y='3' width='22' height='26' rx='3' fill='%23f5f8fa' stroke='%231f3a93' stroke-width='2'/><path d='M11 3v26' stroke='%23d7263d' stroke-width='2'/><path d='M14 16l3 3 6-7' fill='none' stroke='%231f3a93' stroke-width='2.5' stroke-linecap='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="hoja">
    <p class="fecha-hoja" id="fecha-hoja"></p>

    <header class="encabezado">
      <h1>
        Agenda de estudio
        <svg class="subrayado" viewBox="0 0 320 18" preserveAspectRatio="none" aria-hidden="true">
          <path d="M3 12 C 60 4, 120 15, 180 8 S 280 5, 316 10" />
        </svg>
      </h1>
      <p class="saludo" id="saludo"></p>
    </header>

    <section class="semana" aria-labelledby="titulo-semana">
      <h2 id="titulo-semana" class="nota">Esta semana</h2>
      <ol class="dias" id="dias"></ol>
    </section>

    <section class="progreso" aria-live="polite">
      <svg class="lapiz" viewBox="0 0 300 14" preserveAspectRatio="none" aria-hidden="true">
        <path class="lapiz-fondo" d="M2 7 Q 75 3, 150 7 T 298 7" pathLength="100" />
        <path class="lapiz-trazo" id="trazo" d="M2 7 Q 75 3, 150 7 T 298 7" pathLength="100" />
      </svg>
      <p id="resumen">Cargando tus tareas…</p>
    </section>

    <form id="formulario" class="nueva" autocomplete="off">
      <h2 class="nota">Anotar algo nuevo</h2>
      <div class="campo campo-titulo">
        <label for="titulo">Qué tienes que hacer</label>
        <input id="titulo" name="titulo" required maxlength="120" placeholder="Ej.: Ejercicios de pilas y colas">
      </div>
      <div class="campo">
        <label for="materia">Materia</label>
        <input id="materia" name="materia" required maxlength="60" list="materias" placeholder="Estructura de Datos">
        <datalist id="materias"></datalist>
      </div>
      <div class="campo">
        <label for="entrega">Entrega</label>
        <input id="entrega" name="entrega" type="date">
      </div>
      <button type="submit" class="boton">Anotar tarea</button>
      <p class="error" id="error" role="alert" hidden></p>
    </form>

    <div class="barra">
      <nav class="filtros" aria-label="Filtrar tareas">
        <button type="button" data-filtro="pendientes" aria-pressed="true">Pendientes</button>
        <button type="button" data-filtro="hechas" aria-pressed="false">Hechas</button>
        <button type="button" data-filtro="todas" aria-pressed="false">Todas</button>
      </nav>
      <div class="materias-filtro" id="materias-filtro" aria-label="Filtrar por materia"></div>
    </div>

    <ol class="lista" id="lista" aria-label="Tareas"></ol>

    <div class="vacio" id="vacio" hidden>
      <svg viewBox="0 0 120 90" aria-hidden="true">
        <path d="M20 70 L20 28 Q20 20 28 20 L92 20 Q100 20 100 28 L100 70" />
        <path d="M12 70 L108 70" />
        <path d="M45 45 q15 -18 30 0" />
        <circle cx="47" cy="36" r="2.5" /><circle cx="73" cy="36" r="2.5" />
        <path d="M40 52 q20 14 40 0" />
      </svg>
      <p id="vacio-texto"></p>
    </div>

    <footer class="pie">
      Hecho por Alfredo Cruz en Milagro, Ecuador, para no olvidar ninguna entrega.
    </footer>
  </main>

  <div class="sello" id="sello" aria-hidden="true">¡Listo!</div>

  <template id="plantilla-tarea">
    <li class="tarea">
      <div class="margen">
        <time class="fecha"></time>
        <span class="faltan"></span>
      </div>
      <label class="marca">
        <input type="checkbox">
        <span class="texto">
          <span class="titulo"></span>
          <span class="materia"><span class="punto"></span><span class="materia-nombre"></span></span>
        </span>
      </label>
      <button type="button" class="borrar">Borrar</button>
    </li>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
